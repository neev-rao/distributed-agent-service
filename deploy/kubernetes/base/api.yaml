apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: agent-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: agent-api
  template:
    metadata:
      labels:
        app: agent-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: distributed-agent-service:local
          imagePullPolicy: Never
          command: [/app/dbtool]
          args: &policy
            - -executor=$(EXECUTOR)
            - -execution-timeout=$(EXECUTION_TIMEOUT)
            - -queue-capacity=$(QUEUE_CAPACITY)
            - -max-records=$(MAX_RECORDS)
            - -max-attempts=$(MAX_ATTEMPTS)
            - -max-result-bytes=$(MAX_RESULT_BYTES)
            - -lease-duration=$(LEASE_DURATION)
            - -retry-backoff=$(RETRY_BACKOFF)
            - -retention=$(RETENTION)
          envFrom: &config
            - configMapRef:
                name: app-config
          env: &database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database
                  key: DATABASE_URL
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 64Mi}
          securityContext: &security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: api
          image: distributed-agent-service:local
          imagePullPolicy: Never
          command: [/app/server]
          args:
            - -listen=0.0.0.0:8080
            - -shutdown-grace=10s
            - -executor=$(EXECUTOR)
            - -execution-timeout=$(EXECUTION_TIMEOUT)
            - -queue-capacity=$(QUEUE_CAPACITY)
            - -max-records=$(MAX_RECORDS)
            - -max-attempts=$(MAX_ATTEMPTS)
            - -max-result-bytes=$(MAX_RESULT_BYTES)
            - -lease-duration=$(LEASE_DURATION)
            - -retry-backoff=$(RETRY_BACKOFF)
            - -retention=$(RETENTION)
          envFrom: *config
          env: *database
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext: *security
